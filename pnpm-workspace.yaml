# Only install a version of a package that has been published for at least 7 days (in minutes).
minimumReleaseAge: 10080

# esbuild has an install script that only checks or speeds up a binary that already comes as an optional package.
# The repo has always run without it, so deny it. pnpm 12 fails the install for scripts that nobody decided on.
allowBuilds:
  esbuild: false
