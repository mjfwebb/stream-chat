name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_ENV: ci

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/workflows/composites/reusable-install/

      - name: Run tests
        run: pnpm test

  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/workflows/composites/reusable-install/
      - name: Linting
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check

  typecheck:
    name: 🔍 Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/workflows/composites/reusable-install/
      - name: Type checking
        run: pnpm typecheck
