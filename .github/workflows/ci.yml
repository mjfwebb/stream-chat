name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository.
permissions:
  contents: read

env:
  NODE_ENV: ci

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/workflows/composites/reusable-install/

      - name: Run tests
        run: pnpm exec vitest run

  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/workflows/composites/reusable-install/
      - name: Linting
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check

  typecheck:
    name: 🔍 Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/workflows/composites/reusable-install/
      - name: Type checking
        run: pnpm typecheck

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/workflows/composites/reusable-install/
      - name: Build
        run: pnpm exec vite build
